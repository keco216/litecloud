<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#1a73e8" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="description" content="LiteCloud — Your family's private cloud" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="icon" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/favicon.svg" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			// Apply theme IMMEDIATELY to prevent flash of wrong theme
			(function() {
				var t = localStorage.getItem('lc-theme');
				if (t === 'dark') document.documentElement.classList.add('dark-override');
				else if (t === 'light') document.documentElement.classList.add('light-override');
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			if ('serviceWorker' in navigator) {
				navigator.serviceWorker.register('/sw.js');
			}
		</script>
	</body>
</html>
