services:
  litecloud:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - litecloud-data:/data
    environment:
      - UPLOAD_DIR=/data/uploads
      - DB_PATH=/data/litecloud.db
      - BODY_SIZE_LIMIT=Infinity
      - ORIGIN=http://localhost:3000
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
    restart: unless-stopped

  # Optional: Caddy reverse proxy for auto-HTTPS
  # Uncomment and set your domain in Caddyfile
  # caddy:
  #   image: caddy:2-alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile
  #     - caddy-data:/data
  #     - caddy-config:/config
  #   depends_on:
  #     - litecloud

volumes:
  litecloud-data:
  # caddy-data:
  # caddy-config:
